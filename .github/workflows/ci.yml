name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned version.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # CI has no sound card, so the engine is exercised through the offline path.
      - run: cargo run -- render target/ci.wav --seconds 1
      # Load the test plugins from their files, packaged the way plugins are
      # installed: bundles on macOS, single files on Windows.
      - name: Render through the test plugins
        shell: bash
        run: |
          scripts/build-test-plugins.sh
          p=target/test-plugins
          cargo run -- render target/clap.wav --plugin $p/refrain-test-synth.clap | tee target/render.log
          grep -Eq "peak 0\.[1-9]" target/render.log
          # The notes-only plugins rely on refrain to play the sustain pedal,
          # and VST3 plugins take controllers as parameters. All four have to
          # sound exactly the same.
          cargo run -- render target/clap-notes.wav --plugin $p/refrain-test-synth.clap --id dev.refrain.test-synth.notes-only
          cargo run -- render target/vst3.wav --plugin $p/refrain-test-synth.vst3
          cargo run -- render target/vst3-notes.wav --plugin $p/refrain-test-synth.vst3 --id "refrain test synth (notes only)"
          for f in clap-notes vst3 vst3-notes; do cmp target/clap.wav target/$f.wav; done
      # Projects saved with the volume at half bring the plugins back at half,
      # in both formats, and saving them again changes nothing.
      - name: Restore and save projects
        shell: bash
        run: |
          for f in clap vst3; do
            cargo run -- render target/half-$f.wav --plugin tests/projects/half-volume-$f.refrain | tee target/project.log
            # Half of the 0.576 the demo phrase peaks at.
            grep -q "peak 0.288" target/project.log
            cargo run -- editor tests/projects/half-volume-$f.refrain --seconds 1 --save target/resaved-$f.refrain
            cargo run -- render target/resaved-$f.wav --plugin target/resaved-$f.refrain
            cmp target/half-$f.wav target/resaved-$f.wav
          done
          cmp target/half-clap.wav target/half-vst3.wav
      # A project's clips play back exactly like the same phrase sent as
      # events, in both formats. Rendering goes on until the sound dies away:
      # the last note ends at 1.8 s and fades out over 5 ms, so the file ends
      # at 1.805 s.
      - name: Play back clips
        shell: bash
        run: |
          for f in clap vst3; do
            cargo run -- render target/phrase-$f.wav --plugin tests/projects/phrase-$f.refrain | tee target/phrase.log
            grep -q "wrote 86639 frames" target/phrase.log
            cargo run -- render target/demo-$f.wav --plugin target/test-plugins/refrain-test-synth.$f
            cmp target/phrase-$f.wav target/demo-$f.wav
          done
          cmp target/phrase-clap.wav target/phrase-vst3.wav
      # Integer files have the size their sample size gives, and dither is the
      # same every time but changes the file.
      - name: Render to 16 and 24 bits
        shell: bash
        run: |
          phrase=tests/projects/phrase-vst3.refrain
          cargo run -- render target/p16.wav --plugin $phrase --bits 16
          cargo run -- render target/p24.wav --plugin $phrase --bits 24
          cargo run -- render target/p16-dither.wav --plugin $phrase --bits 16 --dither
          cargo run -- render target/p16-dither-again.wav --plugin $phrase --bits 16 --dither
          # 86639 stereo frames, after a 44-byte header (68 for 24 bits).
          test "$(wc -c < target/p16.wav)" -eq $((44 + 86639 * 2 * 2))
          test "$(wc -c < target/p24.wav)" -eq $((68 + 86639 * 2 * 3))
          cmp target/p16-dither.wav target/p16-dither-again.wav
          # Not `! cmp`: bash's -e does not stop on a command that starts with !.
          if cmp -s target/p16.wav target/p16-dither.wav; then
            echo "dither did not change the file" >&2
            exit 1
          fi
      # Tracks put together with the project commands mix the same in both
      # formats, and the same as the projects kept here. Soloing, muting and
      # removing an effect take the mix apart again.
      - name: Mix tracks
        shell: bash
        run: |
          p=target/test-plugins
          for f in clap vst3; do
            if [ $f = clap ]; then fx=dev.refrain.test-effect; else fx="refrain test effect"; fi
            m=target/mix-$f.refrain
            rm -f $m
            cargo run -- new $m
            cargo run -- track add $m tests/projects/phrase-$f.refrain
            cargo run -- track add $m tests/projects/phrase-$f.refrain
            cargo run -- fx add $m $p/refrain-test-synth.$f --id "$fx" --track 2
            cargo run -- mix $m --track 2 --pan -0.5 --volume -6
            cargo run -- fx add $m $p/refrain-test-synth.$f --id "$fx" --master
            cargo run -- show $m
            cargo run -- render target/mix-$f.wav --plugin $m | tee target/mix.log
            # The master's effect clips at 0.25.
            grep -q "peak 0.250" target/mix.log
            # Both instruments and both effects were told it is not real time.
            grep -q "4 of 4 plugins render offline" target/mix.log
            cargo run -- render target/mix-kept-$f.wav --plugin tests/projects/mix-$f.refrain
            cmp target/mix-$f.wav target/mix-kept-$f.wav
            # Saving again keeps every plugin's state, the effects' too.
            cargo run -- editor tests/projects/mix-$f.refrain --seconds 1 --save target/mix-resaved-$f.refrain
            cargo run -- render target/mix-resaved-$f.wav --plugin target/mix-resaved-$f.refrain
            cmp target/mix-$f.wav target/mix-resaved-$f.wav
            # Track 1 alone, without the master's effect, is the phrase.
            cargo run -- fx remove $m 1 --master
            cargo run -- mix $m --track 1 --solo
            cargo run -- render target/solo-$f.wav --plugin $m
            cmp target/solo-$f.wav target/phrase-$f.wav
            # Track 2 alone: clipped at 0.25 by its effect, then 6 dB down,
            # and the right turned down by half more by the pan.
            cargo run -- mix $m --track 1 --unsolo
            cargo run -- mix $m --track 2 --solo
            cargo run -- render target/solo-2-$f.wav --plugin $m --seconds 2 | tee target/mix.log
            grep -q "channels: 0.125 0.063" target/mix.log
            cargo run -- mix $m --track 1 --mute
            cargo run -- mix $m --track 2 --unsolo --mute
            cargo run -- render target/muted-$f.wav --plugin $m --seconds 2 | tee target/mix.log
            grep -q "peak 0.000" target/mix.log
          done
          cmp target/mix-clap.wav target/mix-vst3.wav
      # refrain's own window opens on a project and draws, through wgpu. With
      # an audio output it plays too; CI machines may have none, and the
      # window still opens.
      - name: Open refrain's window
        shell: bash
        run: |
          cargo run -- gui tests/projects/mix-clap.refrain --play --seconds 2 | tee target/gui.log
          grep -q "window: first frame drawn" target/gui.log
      # Open each test plugin's editor in a real window, and check it ended up
      # inside that window.
      - name: Open the test plugins' editors
        shell: bash
        run: |
          p=target/test-plugins
          check_editor() {
            cargo run -- editor "$@" --seconds 1 | tee target/editor.log
            grep -q "editor: 400 x 300, embedded" target/editor.log
          }
          check_editor $p/refrain-test-synth.clap
          check_editor $p/refrain-test-synth.clap --id dev.refrain.test-synth.notes-only
          check_editor $p/refrain-test-synth.vst3
          check_editor $p/refrain-test-synth.vst3 --id "refrain test synth (notes only)"
          check_editor $p/refrain-test-synth.vst3 --id "refrain test effect"

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  no-local-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on paths from a developer's machine
        run: |
          pattern='/(Users|home)/[A-Za-z0-9_.-]+/|[A-Za-z]:\\Users\\'
          if git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "Found a home-directory path. See docs/en/licensing.md." >&2
            exit 1
          fi
