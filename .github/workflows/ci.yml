name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned version.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # CI has no sound card, so the engine is exercised through the offline path.
      - run: cargo run -- render target/ci.wav --seconds 1
      # Load the test plugins from their files, packaged the way plugins are
      # installed: bundles on macOS, single files on Windows.
      - name: Render through the test plugins
        shell: bash
        run: |
          scripts/build-test-plugins.sh
          p=target/test-plugins
          cargo run -- render target/clap.wav --plugin $p/refrain-test-synth.clap | tee target/render.log
          grep -Eq "peak 0\.[1-9]" target/render.log
          # The notes-only plugins rely on refrain to play the sustain pedal,
          # and VST3 plugins take controllers as parameters. All four have to
          # sound exactly the same.
          cargo run -- render target/clap-notes.wav --plugin $p/refrain-test-synth.clap --id dev.refrain.test-synth.notes-only
          cargo run -- render target/vst3.wav --plugin $p/refrain-test-synth.vst3
          cargo run -- render target/vst3-notes.wav --plugin $p/refrain-test-synth.vst3 --id "refrain test synth (notes only)"
          for f in clap-notes vst3 vst3-notes; do cmp target/clap.wav target/$f.wav; done
      # Projects saved with the volume at half bring the plugins back at half,
      # in both formats, and saving them again changes nothing.
      - name: Restore and save projects
        shell: bash
        run: |
          for f in clap vst3; do
            cargo run -- render target/half-$f.wav --plugin tests/projects/half-volume-$f.refrain | tee target/project.log
            # Half of the 0.576 the demo phrase peaks at.
            grep -q "peak 0.288" target/project.log
            cargo run -- editor tests/projects/half-volume-$f.refrain --seconds 1 --save target/resaved-$f.refrain
            cargo run -- render target/resaved-$f.wav --plugin target/resaved-$f.refrain
            cmp target/half-$f.wav target/resaved-$f.wav
          done
          cmp target/half-clap.wav target/half-vst3.wav
      # A project's clips play back exactly like the same phrase sent as
      # events, in both formats.
      - name: Play back clips
        shell: bash
        run: |
          for f in clap vst3; do
            cargo run -- render target/phrase-$f.wav --plugin tests/projects/phrase-$f.refrain --seconds 2
            cargo run -- render target/demo-$f.wav --plugin target/test-plugins/refrain-test-synth.$f
            cmp target/phrase-$f.wav target/demo-$f.wav
          done
          cmp target/phrase-clap.wav target/phrase-vst3.wav
      # Open each test plugin's editor in a real window, and check it ended up
      # inside that window.
      - name: Open the test plugins' editors
        shell: bash
        run: |
          p=target/test-plugins
          check_editor() {
            cargo run -- editor "$@" --seconds 1 | tee target/editor.log
            grep -q "editor: 400 x 300, embedded" target/editor.log
          }
          check_editor $p/refrain-test-synth.clap
          check_editor $p/refrain-test-synth.clap --id dev.refrain.test-synth.notes-only
          check_editor $p/refrain-test-synth.vst3
          check_editor $p/refrain-test-synth.vst3 --id "refrain test synth (notes only)"

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  no-local-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on paths from a developer's machine
        run: |
          pattern='/(Users|home)/[A-Za-z0-9_.-]+/|[A-Za-z]:\\Users\\'
          if git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "Found a home-directory path. See docs/en/licensing.md." >&2
            exit 1
          fi
