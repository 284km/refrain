[package]
name = "refrain-clap"
description = "Hosts CLAP plugins inside the refrain engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
refrain-engine.workspace = true
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "note-ports", "log", "params", "gui", "state"] }
raw-window-handle = "0.6"

[dev-dependencies]
refrain-test-tone = { path = "../refrain-test-tone" }
clack-host = { version = "0.2", features = ["clack-plugin"] }
refrain-test-synth = { path = "../refrain-test-synth" }
