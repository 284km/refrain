[package]
name = "refrain-test-synth"
description = "The CLAP test plugins refrain uses to test plugin hosting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib is the CLAP plugin. rlib lets tests load the same plugin in-process.
crate-type = ["cdylib", "rlib"]

[dependencies]
refrain-test-tone = { path = "../refrain-test-tone" }
refrain-test-editor = { path = "../refrain-test-editor" }
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["clack-plugin", "audio-ports", "note-ports", "gui", "state"] }
