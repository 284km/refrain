[package]
name = "refrain-test-synth-vst3"
description = "The VST3 test plugins refrain uses to test plugin hosting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib is the VST3 plugin. rlib lets tests load the same plugin in-process.
crate-type = ["cdylib", "rlib"]

[dependencies]
refrain-test-tone = { path = "../refrain-test-tone" }
refrain-test-editor = { path = "../refrain-test-editor" }
vst3 = "0.3"
