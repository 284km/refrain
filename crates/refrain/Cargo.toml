[package]
name = "refrain"
description = "A DAW for macOS and Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
refrain-engine.workspace = true
refrain-clap = { path = "../refrain-clap" }
refrain-vst3 = { path = "../refrain-vst3" }
refrain-project = { path = "../refrain-project" }
cpal = "0.18"
hound = "3.5"
midir = "0.11"
rtrb = "0.4"
winit = "0.30"
# The GUI. egui's own fonts are under font licenses this repository does not
# take, so default features are off and the GUI uses the system's fonts.
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "dx12"] }
pollster = "0.4"
# Native file dialogs. Its default features are for Linux desktops.
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
clack-host = { version = "0.2", features = ["clack-plugin"] }
refrain-test-synth = { path = "../refrain-test-synth" }
refrain-test-synth-vst3 = { path = "../refrain-test-synth-vst3" }
refrain-test-tone = { path = "../refrain-test-tone" }
egui_kittest = { version = "0.37", default-features = false, features = ["wgpu", "snapshot"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
