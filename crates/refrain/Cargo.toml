[package]
name = "refrain"
description = "A DAW for macOS and Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
refrain-engine.workspace = true
refrain-clap = { path = "../refrain-clap" }
refrain-vst3 = { path = "../refrain-vst3" }
refrain-project = { path = "../refrain-project" }
cpal = "0.18"
hound = "3.5"
midir = "0.11"
rtrb = "0.4"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
